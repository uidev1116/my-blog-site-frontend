version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @opennextjs/cloudflare の対応状況を確認してから手動で上げる(docs/cloudflare-workers.md 参照)
      - dependency-name: next
      # ツールチェーンの major 更新は、設定・依存の互換性を確認して手動で行う
      # (typescript 7 は typescript-eslint が <6.1 までしか対応しておらず、@eslint/js 10 は eslint 10 と
      # eslint-config-next 同梱のプラグインが未対応)
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # ランタイム(Node 24)とずれる型の major 更新は、Node の更新とあわせて手動で行う
      # (@types/node 26 は Node 24 と不一致)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
