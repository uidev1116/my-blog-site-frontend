name: Deploy to Cloudflare

# 静的書き出しは、記事を更新しても自動では反映されないため、次のタイミングで再ビルド・再デプロイする。
#   - 手動
#   - a-blog cms の更新通知(repository_dispatch: acms-content-updated。docs/cloudflare-workers.md 参照)
#   - 定期実行(a-blog cms の通知漏れと、Zenn の記事一覧の更新を反映する)
# 本番切り替え(DNS)が完了するまでは、push では自動デプロイしない。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [acms-content-updated]
  schedule:
    # 6 時間ごと(UTC)
    - cron: '0 */6 * * *'

# 同時に複数デプロイしない(実行中は待たせ、最新だけ残す)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # production の Environment に、保護ルールの Required reviewers を付けると、
    # 定期実行と a-blog cms の通知が、毎回承認待ちで止まる。付けずに、デプロイ可能なブランチを master に限定する
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test
      # ビルド(a-blog cms の API を呼ぶ)とデプロイは、npm run deploy で 1 つのコマンドとして実行するため、
      # Secret は、このステップにだけ渡す(npm ci や npm test には渡さない)。
      # Worker が実行時に読む変数(Secret 以外)は、--var で渡す。
      # Secret(ACMS_API_KEY / ACMS_API_PREVIEW_KEY)は、Worker に 1 回だけ `wrangler secret put` で登録する(デプロイでは消えない)
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACMS_API_KEY: ${{ secrets.ACMS_API_KEY }}
          ACMS_API_PREVIEW_KEY: ${{ secrets.ACMS_API_PREVIEW_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          ACMS_API_PROTOCOL: ${{ vars.ACMS_API_PROTOCOL }}
          ACMS_API_HOSTNAME: ${{ vars.ACMS_API_HOSTNAME }}
          ACMS_API_PORT: ${{ vars.ACMS_API_PORT }}
          ACMS_ASSETS_PROTOCOL: ${{ vars.ACMS_ASSETS_PROTOCOL }}
          ACMS_ASSETS_HOSTNAME: ${{ vars.ACMS_ASSETS_HOSTNAME }}
          ACMS_ASSETS_PORT: ${{ vars.ACMS_ASSETS_PORT }}
        run: |
          # 必須の変数が空なら、空の設定でデプロイしてしまわないよう、ここで止める(ポートは空でよい)
          for name in NEXT_PUBLIC_BASE_URL ACMS_API_PROTOCOL ACMS_API_HOSTNAME ACMS_ASSETS_PROTOCOL ACMS_ASSETS_HOSTNAME; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub の Variables に $name が設定されていません"
              exit 1
            fi
          done
          args=()
          for name in NEXT_PUBLIC_BASE_URL ACMS_API_PROTOCOL ACMS_API_HOSTNAME ACMS_API_PORT ACMS_ASSETS_PROTOCOL ACMS_ASSETS_HOSTNAME ACMS_ASSETS_PORT; do
            value="${!name}"
            if [ -n "$value" ]; then
              args+=(--var "$name:$value")
            fi
          done
          npm run deploy -- "${args[@]}"
