name: Deploy to Cloudflare

# 手動実行、または a-blog cms の更新通知(repository_dispatch: acms-content-updated)で再デプロイする。
# 本番切り替え(DNS)が完了するまでは、push では自動デプロイしない。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [acms-content-updated]

# 同時に複数デプロイしない(実行中は待たせ、最新だけ残す)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      ACMS_API_PROTOCOL: ${{ vars.ACMS_API_PROTOCOL }}
      ACMS_API_HOSTNAME: ${{ vars.ACMS_API_HOSTNAME }}
      ACMS_API_PORT: ${{ vars.ACMS_API_PORT }}
      ACMS_API_KEY: ${{ secrets.ACMS_API_KEY }}
      ACMS_API_PREVIEW_KEY: ${{ secrets.ACMS_API_PREVIEW_KEY }}
      ACMS_ASSETS_PROTOCOL: ${{ vars.ACMS_ASSETS_PROTOCOL }}
      ACMS_ASSETS_HOSTNAME: ${{ vars.ACMS_ASSETS_HOSTNAME }}
      ACMS_ASSETS_PORT: ${{ vars.ACMS_ASSETS_PORT }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        run: npm run deploy
