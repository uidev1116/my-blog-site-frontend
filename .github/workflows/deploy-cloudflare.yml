name: Deploy to Cloudflare

# ビルドとデプロイは、Cloudflare(Workers Builds)で行う。このワークフローは、Cloudflare の Deploy Hook を呼んで、
# ビルドを開始するだけ(コードの取得・依存のインストール・Cloudflare や a-blog cms のキーは、GitHub に不要)。
# Deploy Hook の作り方は、docs/cloudflare-workers.md を参照。
#
# 静的書き出しは、記事を更新しても自動では反映されないため、次のタイミングで再ビルド・再デプロイする。
#   - 手動
#   - 他のシステムからの通知(repository_dispatch: acms-content-updated。ヘッダーを指定できる場合)。
#     a-blog cms のスタンダードライセンスは、Webhook にヘッダーを指定できないため、Cloudflare の Deploy Hook を直接呼ぶ
#   - 定期実行(a-blog cms の通知漏れと、Zenn の記事一覧の更新を反映する)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [acms-content-updated]
  schedule:
    # 6 時間ごと(UTC)
    - cron: '0 */6 * * *'

# 同時に複数を走らせない(Deploy Hook 側でも、開始前の重複するビルドは、まとめられる)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# リポジトリには、アクセスしない
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deploy Hook の URL(Secret)は、production の Environment に登録する。
    # Environment に Required reviewers を付けると、定期実行と通知が、毎回承認待ちで止まるため、付けない
    environment: production
    steps:
      - name: Trigger build
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            # 手動実行は、設定の不足を、はっきり失敗させる。定期実行・通知からは、未設定の間は、失敗の通知を飛ばさず、スキップする
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Environment production の Secret CLOUDFLARE_DEPLOY_HOOK_URL が設定されていません"
              exit 1
            fi
            echo "::notice::CLOUDFLARE_DEPLOY_HOOK_URL が未設定のため、スキップしました"
            exit 0
          fi
          # URL(秘密)とレスポンス全体は表示せず、ビルド ID だけを表示する
          response="$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X POST "$HOOK_URL")"
          echo "$response" | jq -e '.success == true' > /dev/null
          echo "build_uuid: $(echo "$response" | jq -r '.result.build_uuid')"
          echo "already_exists: $(echo "$response" | jq -r '.result.already_exists // false')"
